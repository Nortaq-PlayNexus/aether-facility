name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of AETHER FACILITY are you using? (check `python _SCRIPTS\facility.py menu` or the exe version)
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running on?
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version (if running from source)
      description: Run `python --version`
      placeholder: "3.11.4"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I run `facility.py scout --download`, it fails with..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Clone repo
        2. Run `python _SCRIPTS\facility.py init`
        3. Run `python _SCRIPTS\facility.py scout --download`
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The scout should download files from sources..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, logs, screenshots.
      placeholder: "Got error: ConnectionError..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Paste relevant logs, error messages, or terminal output.
      render: shell
      placeholder: |
        $ python _SCRIPTS\facility.py scout --download
        Traceback (most recent call last):
          ...
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have tested with the latest version
          required: true
        - label: I have included all relevant logs and error messages
          required: true